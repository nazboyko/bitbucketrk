services:
  app:
    build: .
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
  vite:
    image: node:24-alpine
    working_dir: /app
    command: npm run dev
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:5173:5173"
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: pe_destinations
      MYSQL_USER: laravel
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: [ "CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  mysql_data:
